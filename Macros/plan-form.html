<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><title>Macros | Make a plan</title>
</head>
<body class="home-page">
  <nav class="navbar" aria-label="Primary navigation">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>Macros</a>
    <div class="nav-right">
      <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode">Mode</button>
      <a href="index.html">Home</a>
      <a href="plan-form.html" class="active" data-plan-link>Make a plan</a>
      <a href="plan.html" data-plan-link>My plan</a>
      <a href="login.html" data-auth-guest>Log in</a>
      <span class="nav-user" data-auth-user style="display:none">Hi, <span data-user-name></span></span>
      <button type="button" class="button-secondary nav-logout" data-auth-user style="display:none" onclick="logOut()">Log out</button>
    </div>
  </nav>
  <main class="dashboard home-dashboard">
    <section class="form-panel" aria-labelledby="details-title"><div class="panel-heading"><p class="eyebrow">01 - Your details</p><h2 id="details-title">Let's make it personal.</h2></div>
      <form id="userForm"><fieldset><legend class="sr-only">Plan preferences</legend><div class="form-grid">
        <label>Age <input type="number" id="ageInput" min="13" placeholder="Years" required></label>
        <label>Goal <select id="goalSelect"><option>Muscle Gain</option><option>Weight Loss</option></select></label>
        <label>Weight <span class="input-pair"><input type="number" id="weightInput" min="1" placeholder="0" required><select id="weightUnit" aria-label="Weight unit"><option value="kg">kg</option><option value="lb">lb</option></select></span></label>
        <label>Height <span class="input-pair"><input type="number" id="heightInput" min="1" placeholder="0" required><select id="heightUnit" aria-label="Height unit"><option value="cm">cm</option><option value="in">in</option></select></span></label>
        <label>Training level <select id="levelSelect"><option value="Beginner">Beginner</option><option value="Intermediate">Intermediate</option><option value="Advanced">Advanced</option></select></label>
        <label>Equipment <select id="equipmentSelect"><option value="Bodyweight">Bodyweight only</option><option value="Dumbbells">Dumbbells</option><option value="Gym">Full gym</option></select></label>
        <label>Dietary style <select id="dietSelect"><option value="Standard">No preference</option><option value="Vegetarian">Vegetarian</option><option value="Vegan">Vegan</option></select></label>
        <label>Wake-up time <input type="time" id="wakeTime" required></label>
        <label>Sleep time <input type="time" id="sleepTime" required></label>
      </div><div class="form-footer"><p>Your plan stays on this device, so you can return and build on your progress.</p><button type="submit">Generate my plan <span aria-hidden="true">-></span></button></div></fieldset></form>
    </section>
  </main>
  <footer>Macros <span>&middot;</span> move with intent</footer>
  <script src="script.js"></script>
</body></html>
