<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Macros | Build your plan</title></head>
<body><nav class="navbar"><a class="brand" href="index.html"><span class="brand-mark"></span>Macros</a><div class="nav-right"><button class="theme-toggle" type="button" onclick="toggleTheme()">Dark</button><a href="index.html">Home</a><a href="plan.html" data-plan-link>My plan</a></div></nav><main class="dashboard home-dashboard"><section class="form-panel"><div class="panel-heading"><p class="eyebrow">01 - Your details</p><h1>Make it<br><em>personal.</em></h1></div><form id="userForm"><fieldset><legend class="sr-only">Plan preferences</legend><div class="form-grid"><label>Age <input type="number" id="ageInput" min="13" placeholder="Years" required></label><label>Goal <select id="goalSelect"><option>Muscle Gain</option><option>Weight Loss</option></select></label><label>Weight <span class="input-pair"><input type="number" id="weightInput" min="1" placeholder="0" required><select id="weightUnit"><option value="kg">kg</option><option value="lb">lb</option></select></span></label><label>Height <span class="input-pair"><input type="number" id="heightInput" min="1" placeholder="0" required><select id="heightUnit"><option value="cm">cm</option><option value="in">in</option></select></span></label><label>Training level <select id="levelSelect"><option value="Beginner">Beginner</option><option value="Intermediate">Intermediate</option><option value="Advanced">Advanced</option></select></label><label>Equipment <select id="equipmentSelect"><option value="Bodyweight">Bodyweight only</option><option value="Dumbbells">Dumbbells</option><option value="Gym">Full gym</option></select></label><label>Dietary style <select id="dietSelect"><option value="Standard">No preference</option><option value="Vegetarian">Vegetarian</option><option value="Vegan">Vegan</option></select></label><label>Smartwatch <select id="watchSelect"><option value="None">Not using one</option><option value="Apple Watch">Apple Watch</option><option value="Wear OS">Wear OS watch</option><option value="Fitbit">Fitbit</option><option value="Other">Other smartwatch</option></select></label><label>Wake-up time <input type="time" id="wakeTime" required></label><label>Sleep time <input type="time" id="sleepTime" required></label></div><div class="form-footer"><p>Plans are tailored to your goal, experience, equipment, and dietary style.</p><button type="submit">Generate my plan -></button></div></fieldset></form></section></main><script src="script.js"></script></body></html>
