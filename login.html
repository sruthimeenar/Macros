<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macros | Log in</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar" aria-label="Primary navigation">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>Macros</a>
  <div class="nav-right">
    <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode">Dark</button>
    <a href="index.html">Home</a>
  </div>
</nav>

<main class="dashboard auth-dashboard">
  <section class="auth-panel" aria-labelledby="auth-title">
    <div class="panel-heading">
      <p class="eyebrow">Welcome to Macros</p>
      <h2 id="auth-title">Log in or create an account</h2>
    </div>

    <div class="auth-tabs" role="tablist">
      <button type="button" id="tabLogin" class="auth-tab active" role="tab" onclick="showLogin()">Log in</button>
      <button type="button" id="tabSignup" class="auth-tab" role="tab" onclick="showSignup()">Sign up</button>
    </div>

    <p id="authError" class="auth-error" style="display:none" role="alert"></p>

    <div id="loginPanel">
      <form id="loginForm" novalidate>
        <label>Email
          <input type="email" id="loginEmail" required autocomplete="email">
        </label>
        <label>Password
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </label>
        <button type="submit">Log in -&gt;</button>
      </form>
    </div>

    <div id="signupPanel" style="display:none">
      <form id="signupForm" novalidate>
        <label>Name
          <input type="text" id="signupName" required autocomplete="name">
        </label>
        <label>Email
          <input type="email" id="signupEmail" required autocomplete="email">
        </label>
        <label>Password
          <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password">
        </label>
        <label>Confirm password
          <input type="password" id="signupConfirm" required minlength="6" autocomplete="new-password">
        </label>
        <button type="submit">Create account -&gt;</button>
      </form>
    </div>

    <p class="auth-note">Your account, plan, and progress are saved on the Macros server, so they're there whenever you log back in — see /backend if you're running your own copy.</p>
  </section>
</main>

<footer>Macros <span>&middot;</span> your data, your browser</footer>
<script src="script.js"></script>
</body>
</html>
